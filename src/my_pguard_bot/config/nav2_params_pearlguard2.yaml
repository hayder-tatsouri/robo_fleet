# Nav2 parameters for PGuard: heavier vehicle (250 kg), RTK GPS, 4 ultrasonics.
# Tight goal tolerances allowed by centimeter-precision GNSS.

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: pearlguard2/base_footprint
    odom_topic: odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 30.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15   # RTK allows this
      yaw_goal_tolerance: 0.20
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 2.0             # 7.2 km/h cruise. Straight-line cap;
                                          # RegulatedPurePursuit scales down in tight curvature.
      lookahead_dist: 4.0                 # longer lookahead = smoother, less snappy
      min_lookahead_dist: 1.5
      max_lookahead_dist: 8.0
      lookahead_time: 2.0
      rotate_to_heading_angular_vel: 1.2  # snappier when a rotation IS needed
      transform_tolerance: 0.5            # tolerate stalled sim time on slow hosts
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.4   # don't crawl the final approach
      approach_velocity_scaling_dist: 1.5 # shorter deceleration ramp
      # With only 4 short-range sonars, the controller's forward collision
      # check keeps triggering on unknown local-costmap cells. The sonar
      # obstacle_layer already stops us at 5 m for real obstacles.
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 1.2  # only slow for really tight turns
      regulated_linear_scaling_min_speed: 0.6
      allow_reversing: false
      # rotate_to_heading=true with a 0.6 rad threshold made the robot
      # STOP and rotate in place whenever the path bearing differed by
      # more than 34 degrees, which reads as a freeze. Turn it off:
      # pure-pursuit smoothly aligns via curvature commands.
      use_rotate_to_heading: false
      rotate_to_heading_min_angle: 0.9
      max_angular_accel: 3.0              # snappier steering response
      max_robot_pose_search_dist: 15.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: pearlguard2/odom  
      robot_base_frame: pearlguard2/base_footprint
      rolling_window: true
      width: 15
      height: 15
      resolution: 0.15
      robot_radius: 0.95     # circumscribing radius of 1.5x1.1 chassis
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: velodyne_scan

        velodyne_scan:
          topic: ouster/points
          data_type: PointCloud2
          marking: true
          clearing: true
          obstacle_max_range: 20.0
          raytrace_max_range: 22.0
          max_obstacle_height: 2.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 1.5
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 0.5     # was 1.0 - halves DDS bandwidth for the 1.44 M-cell grid
      global_frame: map
      robot_base_frame: pearlguard2/base_footprint
      robot_radius: 0.95
      resolution: 1.0    # 1 m/cell outdoors -> 1200x1200 -> 1.44M cells (~1.4 MB)
      track_unknown_space: true
      # NOT rolling: the perimeter patrol reaches ~500 m from origin, so
      # we need a static costmap large enough to cover Novation City.
      rolling_window: false
      width: 1200          # was 1400 - the PGM extent is exactly 1200x1200
      height: 1200
      origin_x: -600.0     # matches maps/novation_city.yaml origin
      origin_y: -600.0
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_subscribe_transient_local: true
        subscribe_to_updates: true
        # trinary_costmap=false so the intermediate grey (off-road, 100) is
        # preserved as a NON-LETHAL cost gradient - the planner will avoid
        # off-road cells but can cross them when needed. With trinary=true
        # every non-free cell becomes LETHAL and PGuard cannot leave a road.
        trinary_costmap: false
        lethal_cost_threshold: 100
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: velodyne_scan

        velodyne_scan:
          topic: ouster/points
          data_type: PointCloud2
          marking: true
          clearing: true
          obstacle_max_range: 20.0
          raytrace_max_range: 22.0
          max_obstacle_height: 2.0
      # false for global: only publish incremental updates (huge saving on
      # the 1.44M-cell grid). RViz still shows the full map because
      # map_server publishes it as latched.
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:             {plugin: "nav2_behaviors::Spin"}
    backup:           {plugin: "nav2_behaviors::BackUp"}
    drive_on_heading: {plugin: "nav2_behaviors::DriveOnHeading"}
    wait:             {plugin: "nav2_behaviors::Wait"}
    local_frame: pearlguard2/odom
    global_frame: map
    robot_base_frame: pearlguard2/base_footprint
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.5

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 500     # ms - short dwell on this CPU-only host

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [3.5, 0.0, 2.0]
    min_velocity: [-0.5, 0.0, -1.0]
    max_accel: [1.5, 0.0, 1.5]
    max_decel: [-1.5, 0.0, -2.0]
    odom_topic: odometry/filtered
    odom_duration: 0.1
