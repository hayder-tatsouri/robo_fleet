/pearlguard2/navsat_transform:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    delay: 3.0
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0
    zero_altitude: true
    broadcast_utm_transform: false
    publish_filtered_gps: true
    use_odometry_yaw: true
    wait_for_datum: true
    datum: [35.8173, 10.5912, 0.0]
    
    map_frame: map
    odom_frame: pearlguard2/odom
    base_link_frame: pearlguard2/base_footprint
